
stock_responses:

  - id: shop_blacksmith_greet_01
    text: "Do you need any [armor] today?"
    context: shop
    role: blacksmith
    speaker_target: pc
    intent: [greet, sell, help]
    mood:
      friendliness: 0.8
      irritability: -0.2
      trust: 0.2
      sociability: 0.2
      greed: 0.1
      diplomacy: 0.2
      familiarity: 0.1
      resentment: -0.1
    requires:
      # Hard gates: only allow if the NPC isn't in a terrible state
      stress: { max: 0.75 }
      irritability: { max: 0.80 }
    forbids:
      # Example: if the NPC is actively hostile, don't use a polite shop opener
      resentment: { min: 0.85 }
    min_affinity: 0.25
    weight: 1.0
    cooldown:
      self_seconds: 12
      group: shop_greeting
      group_seconds: 6

